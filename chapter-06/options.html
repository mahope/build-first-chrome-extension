<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { font-size: 24px; }
    .rule {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .rule input {
      flex: 1;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
    }
    .rule button {
      padding: 6px 10px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .add-btn {
      padding: 6px 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 8px;
    }
    .save-btn {
      padding: 8px 24px;
      background: #34a853;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 16px;
      font-size: 14px;
    }
    .status { margin-top: 8px; color: #666; }
  </style>
</head>
<body>
  <h1>Clean Copy Lite Settings</h1>
  <p>Custom find-and-replace rules are applied after every copy:</p>
  <div id="rules"></div>
  <button class="add-btn" id="add-rule">Add Rule</button>
  <br><br>
  <button class="save-btn" id="save">Save Rules</button>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
