<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 12px;
      margin: 0;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 8px;
      color: #1a1a1a;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 13px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #666;
    }
    .output {
      margin-top: 8px;
      min-height: 60px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    button {
      margin-top: 8px;
      padding: 6px 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #1557b0;
    }
    button.copy-btn {
      background: #34a853;
    }
    .status {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h2>Clean Copy Lite</h2>
  <textarea id="input" placeholder="Paste HTML or messy text here..."></textarea>
  <button id="convert">Convert to Markdown</button>
  <div class="output" id="output"></div>
  <button class="copy-btn" id="copy" style="display:none">Copy to Clipboard</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
